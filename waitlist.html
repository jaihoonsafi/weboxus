<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="canonical" href="https://oxus.app/waitlist.html">
  <meta name="theme-color" content="#0a0a0a">

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #fafafa;
      color: #141414;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 clamp(2rem, 6vw, 6rem);
      height: 56px;
      background: rgba(250,250,250,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #000;
      text-decoration: none;
    }

    .logo img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: block;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .nav-secondary {
      font-size: 0.82rem;
      font-weight: 600;
      color: #666;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-secondary:hover { color: #000; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: calc(56px + clamp(3rem, 10vw, 5.5rem)) clamp(1.5rem, 5vw, 3rem) clamp(3.5rem, 10vw, 6rem);
      text-align: center;
    }

    .inner {
      width: 100%;
      max-width: 420px;
    }

    .inner h1 {
      font-size: clamp(1.65rem, 4.5vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.038em;
      line-height: 1.12;
      color: #0a0a0a;
      margin-bottom: 0.75rem;
    }

    .faded { color: #b8b8b8; }

    .lead {
      font-size: 0.9375rem;
      font-weight: 400;
      color: #737373;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.75rem;
      background: #000;
      color: #fff;
      border-radius: 100px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
      width: 100%;
      max-width: 100%;
    }

    .btn:hover { opacity: 0.85; }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .secondary {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #888;
    }

    .secondary a {
      color: #444;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    .secondary a:hover { color: #000; }

    footer {
      padding: 2rem clamp(2rem, 6vw, 6rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eee;
      font-size: 0.8rem;
      color: #999;
    }

    footer a {
      color: #999;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: #000; }

    .footer-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .r {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    .r.v {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 520px) {
      .nav-secondary { display: none; }
    }

    @media (max-width: 640px) {
      footer {
        flex-direction: column;
        gap: 0.8rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo"><img src="logo.png" alt="Oxus">oxus</a>
    <div class="nav-right">
      <a href="index.html" class="nav-secondary">Home</a>
    </div>
  </nav>

  <main>
    <div class="inner r">
      <h1><span>Oxus is</span> <span class="faded">live.</span></h1>
      <p class="lead">Download on the App Store and start your free trial — lose weight while eating the food you love, no diet required.</p>

      <a href="https://apps.apple.com/au/app/oxus-weight-loss/id6765587305" class="btn" rel="noopener noreferrer" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.03-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        Download on the App Store
      </a>

      <p class="secondary">Prefer the website first? <a href="index.html">Back to home</a></p>
    </div>
  </main>

  <footer>
    <span>&copy; 2026 Oxus</span>
    <ul class="footer-links">
      <li><a href="privacy.html">Privacy</a></li>
      <li><a href="terms.html">Terms</a></li>
      <li><a href="support.html">Support</a></li>
    </ul>
  </footer>

  <script>
    var o = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('v'); });
    }, { threshold: 0.15 });
    document.querySelectorAll('.r').forEach(function (el) { o.observe(el); });
  </script>

</body>
</html>
